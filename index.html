        body {

        .container {

        .card {
            position: relative;
            background: linear-gradient(160deg, #0d0d1f 0%, #050510 40%, #0a0a1a 100%);
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow:

            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            box-shadow: 0 0 15px #FFD700;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .top-buttons {

            justify-content: space-between;

        .fb-btn {
            width: 100%;
            padding: 22px 20px;
            background: linear-gradient(to bottom, #2b95ff, #0a52c4);
            border: 2.5px solid #FFD700;
            border-radius: 18px;
            color: white;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 25px rgba(43, 149, 255, 0.8),
                0 0 55px rgba(43, 149, 255, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
            margin-bottom: 22px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.3px;
            text-decoration: none;
        }

        .fb-btn:hover {
            background: linear-gradient(to bottom, #4da8ff, #1e6fd8);
            transform: translateY(-3px);
            box-shadow: 
                0 0 35px rgba(43, 149, 255, 1),
                0 0 75px rgba(43, 149, 255, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.4),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        .fb-btn .fb-icon {
            position: relative;
            background: linear-gradient(180deg, #4a9eff 0%, #1877F2 50%, #0d5bbf 100%);
            color: #ffffff;
            width: 56px;
            height: 56px;
            border-radius: 50%;

                inset 0 3px 6px rgba(255, 255, 255, 0.4),

            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            padding-bottom: 5px;
            padding-right: 1px;
            transition: all 0.3s ease;
        }

        .fb-btn:hover .fb-icon {
            transform: scale(1.1);
        }

        .extra-text {

            color: #FFD700;

            text-shadow:

            line-height: 1.6;
            letter-spacing: 0.4px;

        }
